name: Release on Package Version Change

on:
  push:
    paths:
      - 'Package.swift'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Get package version
        id: get_version
        run: |
          set -e
          VERSION_LINE=$(grep -m1 "package-version:" Package.swift || true)
          if [ -z "$VERSION_LINE" ]; then
            echo "package-version not found" >&2
            exit 1
          fi
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*package-version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag exists
        id: tagcheck
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if tag exists
        if: steps.tagcheck.outputs.exists == 'true'
        run: |
          echo "Tag v${VERSION} already exists. Exiting."
          exit 0

      - name: Run build
        run: |
          chmod +x ./build.sh || true
          ./build.sh

      - name: Commit updated Sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            CHANGED=false
          else
            git commit -m "chore: update Sources after build for v${VERSION}"
            CHANGED=true
          fi
          echo "CHANGED=$CHANGED" >> $GITHUB_ENV
          if [ "$CHANGED" = "true" ]; then
            git push
          fi

      - name: Create and push tag
        run: |
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
